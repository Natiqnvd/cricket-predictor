[project]
name = "cricket-predictor"
version = "0.1.0"
description = "probability calculator for cricket matches based on various factors"
authors = [
    {name = "Natiq Naveed",email = "Natiqnvd@gmail.com"}
]
readme = "README.md"
requires-python = "3.13.2"
dependencies = [
    "alembic (>=1.16.5,<2.0.0)",
    "fastapi (>=0.117.1,<0.118.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
