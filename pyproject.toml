[tool.poetry]
name = "cricket-predictor"
version = "0.1.0"
description = "Probability calculator for cricket matches based on various factors"
authors = ["Natiq Naveed <Natiqnvd@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
alembic = ">=1.16.5,<2.0.0"
fastapi = ">=0.117.1,<0.118.0"
loguru = ">=0.7.3,<0.8.0"
uvicorn = {extras = ["standard"], version = ">=0.30,<0.31"}
pydantic = ">=2.8,<3.0"
sqlalchemy = "^2.0.43"
celery = "^5.5.3"
python-dotenv = "^1.1.1"
asyncpg = "^0.30.0"
pydantic-settings = "^2.11.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-asyncio = ">=0.23,<0.24"
ruff = ">=0.5,<0.6"
mypy = ">=1.10,<1.11"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
